<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/application.css" />
</head>
<body>

  <header class="topbar">
  <div class="brand">Job Portal</div>
  <div class="topbar-right">
    <nav>
      <a href="/UI/html/job_management.html">My Postings</a>
      <a href="/UI/html/employer_applications.html">Applications</a>
      <a href="/UI/html/messages.html?role=employer">Messages</a>
      <a href="/UI/html/employer_notifications.html" class="active">Notifications</a>
    </nav>
    <a href="/UI/html/browse_job.html" class="role-switch">Job Seeker</a>
  </div>
</header>

  <div class="dev-user-bar" id="devUserBar"></div>

  <main class="page">
    <h1>Notifications</h1>
    <p class="subtitle">Stay updated on applications and messages from job seekers.</p>

    <button class="btn btn-secondary" id="clearAllBtn" style="margin-bottom:14px;">Clear all</button>

    <div class="notification-list" id="notificationList">
      <p class="subtitle">Loading notifications...</p>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script>
    const employerId = (typeof getCurrentEmployerId === "function") ? getCurrentEmployerId() : 1;
    if (typeof renderDevEmployerBar === "function") {
      renderDevEmployerBar("devUserBar");
    }

    // Fallbacks in case api.js on the server doesn't have these yet —
    // keeps this page working even if that file is out of sync.
    if (typeof deleteNotification !== "function") {
      window.deleteNotification = function (notificationId, role, userId) {
        return fetch(`/api/notifications/${notificationId}?role=${role}&user_id=${userId}`, {
          method: "DELETE",
        }).then((res) => {
          if (!res.ok) throw new Error("Failed to remove notification");
          return res.json();
        });
      };
    }
    if (typeof clearAllNotifications !== "function") {
      window.clearAllNotifications = function (role, userId) {
        return fetch(`/api/notifications?role=${role}&user_id=${userId}`, {
          method: "DELETE",
        }).then((res) => {
          if (!res.ok) throw new Error("Failed to clear notifications");
          return res.json();
        });
      };
    }
    if (typeof escapeHtml !== "function") {
      window.escapeHtml = function (str) {
        if (!str) return "";
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      };
    }
    if (typeof apiFetch !== "function") {
      window.apiFetch = async function (path, options = {}) {
        const res = await fetch(path, options);
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.detail || res.statusText);
        }
        return res.json();
      };
    }

    function notificationCardHtml(note) {
      return `
        <div class="notification-card" data-id="${note.id}">
          <div class="notification-icon">🔔</div>
          <div class="notification-content">
            <h3>${escapeHtml(note.title)}</h3>
            <p>${escapeHtml(note.message)}</p>
            <div class="notification-time">${escapeHtml(note.time_ago)}</div>
          </div>
          <button class="btn btn-secondary remove-notification-btn" data-id="${note.id}" title="Remove">✕</button>
        </div>
      `;
    }

    async function loadNotifications() {
      const listEl = document.getElementById("notificationList");
      try {
        // Was calling /api/notifications?role=employer&user_id= — that path/param
        // combo doesn't exist. The actual employer endpoint (added alongside
        // the seeker one in applications.py) is /api/employer/notifications?employer_id=.
        const notifications = await apiFetch(`/api/employer/notifications?employer_id=${employerId}`);

        if (notifications.length === 0) {
          listEl.innerHTML = `
            <p class="subtitle" style="text-align:center; color:#777; margin-top:30px;">
              You don't have any notifications yet.
            </p>
          `;
          return;
        }

        listEl.innerHTML = notifications.map(notificationCardHtml).join("");
        wireRemoveButtons();
      } catch (err) {
        console.error(err);
        listEl.innerHTML = `
          <p class="status-msg error">
            Couldn't load notifications: ${escapeHtml(err.message)}. Is the FastAPI server running?
          </p>
        `;
      }
    }

    function wireRemoveButtons() {
      document.querySelectorAll(".remove-notification-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const id = Number(btn.dataset.id);
          btn.disabled = true;
          try {
            await deleteNotification(id, "employer", employerId);
            await loadNotifications();
          } catch (err) {
            alert(`Couldn't remove notification: ${err.message}`);
            btn.disabled = false;
          }
        });
      });
    }

    document.getElementById("clearAllBtn").addEventListener("click", async () => {
      if (!confirm("Remove all notifications? This can't be undone.")) return;
      try {
        await clearAllNotifications("employer", employerId);
        await loadNotifications();
      } catch (err) {
        alert(`Couldn't clear notifications: ${err.message}`);
      }
    });

    document.addEventListener("DOMContentLoaded", loadNotifications);
  </script>
</body>
</html>
