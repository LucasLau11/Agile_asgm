<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirm Email</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/application.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Job Portal</div>
  </header>

  <main class="page" style="max-width:600px; margin:60px auto;">
    <h1>Confirm Your Email</h1>
    <p class="subtitle">Verifying your email address...</p>

    <div id="confirmStatus" style="margin:32px 0; text-align:center;">
      <p style="font-size:1.2rem;">⏳ Please wait...</p>
    </div>

    <div id="confirmResult" style="display:none;">
      <div id="successBox" style="display:none; padding:20px; border-radius:8px; background:#e8f5e9; border:1px solid #4caf50;">
        <h2 style="color:#2e7d32; margin-top:0;">✓ Email Confirmed</h2>
        <p>Your email has been successfully verified. You can now use all features of your account.</p>
        <a href="/UI/html/profile.html" class="btn btn-primary" style="display:inline-block; margin-top:12px;">Go to Profile</a>
        <a href="/UI/html/browse_job.html" class="btn btn-secondary" style="display:inline-block; margin-top:12px; margin-left:8px;">Browse Jobs</a>
      </div>

      <div id="errorBox" style="display:none; padding:20px; border-radius:8px; background:#ffebee; border:1px solid #f44336;">
        <h2 style="color:#c62828; margin-top:0;">✗ Confirmation Failed</h2>
        <p id="errorMessage"></p>
        <a href="/UI/html/profile.html" class="btn btn-secondary" style="display:inline-block; margin-top:12px;">Back to Profile</a>
        <a href="/UI/html/register.html" class="btn btn-secondary" style="display:inline-block; margin-top:12px; margin-left:8px;">Request New Link</a>
      </div>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script>
    async function confirmEmail() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");

      if (!token) {
        showError("No confirmation token provided.");
        return;
      }

      try {
        const result = await confirmEmailToken(token);
        showSuccess();
      } catch (err) {
        showError(err.message || "Email confirmation failed. The link may have expired.");
      }
    }

    function showSuccess() {
      document.getElementById("confirmStatus").style.display = "none";
      document.getElementById("confirmResult").style.display = "block";
      document.getElementById("successBox").style.display = "block";
    }

    function showError(message) {
      document.getElementById("confirmStatus").style.display = "none";
      document.getElementById("confirmResult").style.display = "block";
      document.getElementById("errorBox").style.display = "block";
      document.getElementById("errorMessage").textContent = message;
    }

    // Start confirmation on page load
    confirmEmail();
  </script>
</body>
</html>
