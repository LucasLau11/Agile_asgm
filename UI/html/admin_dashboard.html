<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/application.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Job Portal — Admin</div>
    <div class="topbar-right">
      <div class="dev-user-bar" id="devUserBar"></div>
    </div>
  </header>

  <main class="page">
    <h1>Admin dashboard</h1>
    <p class="subtitle">Moderate job seeker and employer accounts.</p>

    <section class="profile-section">
      <h2>Job seekers</h2>
      <div id="seekersList"><p class="loading-state">Loading…</p></div>
    </section>

    <section class="profile-section">
      <h2>Employers</h2>
      <div id="employersList"><p class="loading-state">Loading…</p></div>
    </section>
  </main>

  <script src="../js/api.js"></script>
  <script>
    async function init() {
      const account = await requireLogin("admin");
      if (!account) return;
      renderAccountBar("devUserBar", account);
      await Promise.all([loadSeekers(), loadEmployers()]);
    }

    function statusBadgeHtml(status) {
      return `<span class="skill-tag${status === "suspended" ? " missing" : ""}">${escapeHtml(status)}</span>`;
    }

    function seekerRowHtml(seeker) {
      const suspendLabel = seeker.status === "suspended" ? "Unsuspend" : "Suspend";
      return `
        <div class="entry-card">
          <div class="entry-card-header">
            <div>
              <div class="entry-title">${escapeHtml(seeker.full_name || "(no name set)")}</div>
              <div class="entry-subtitle">${escapeHtml(seeker.email || "(no email set)")} &nbsp;${statusBadgeHtml(seeker.status)}</div>
            </div>
            <div>
              <button type="button" class="btn btn-secondary" data-action="suspend-seeker" data-id="${seeker.seeker_id}" data-status="${seeker.status}">${suspendLabel}</button>
              <button type="button" class="btn btn-secondary" data-action="delete-seeker" data-id="${seeker.seeker_id}" data-name="${escapeHtml(seeker.full_name || seeker.email || "this seeker")}">Delete</button>
            </div>
          </div>
        </div>`;
    }

    function employerRowHtml(employer) {
      const suspendLabel = employer.status === "suspended" ? "Unsuspend" : "Suspend";
      return `
        <div class="entry-card">
          <div class="entry-card-header">
            <div>
              <div class="entry-title">${escapeHtml(employer.company_name)}</div>
              <div class="entry-subtitle">${escapeHtml(employer.email)} &nbsp;${statusBadgeHtml(employer.status)}</div>
            </div>
            <div>
              <button type="button" class="btn btn-secondary" data-action="suspend-employer" data-id="${employer.id}" data-status="${employer.status}">${suspendLabel}</button>
              <button type="button" class="btn btn-secondary" data-action="delete-employer" data-id="${employer.id}" data-name="${escapeHtml(employer.company_name)}">Delete</button>
            </div>
          </div>
        </div>`;
    }

    async function loadSeekers() {
      const el = document.getElementById("seekersList");
      try {
        const seekers = await fetchAdminSeekers();
        el.innerHTML = seekers.length === 0
          ? `<p class="subtitle" style="font-size:0.88rem;">No job seeker accounts yet.</p>`
          : seekers.map(seekerRowHtml).join("");
        wireSeekerButtons();
      } catch (err) {
        el.innerHTML = `<p class="status-msg error">Couldn't load job seekers: ${escapeHtml(err.message)}</p>`;
      }
    }

    async function loadEmployers() {
      const el = document.getElementById("employersList");
      try {
        const employers = await fetchAdminEmployers();
        el.innerHTML = employers.length === 0
          ? `<p class="subtitle" style="font-size:0.88rem;">No employer accounts yet.</p>`
          : employers.map(employerRowHtml).join("");
        wireEmployerButtons();
      } catch (err) {
        el.innerHTML = `<p class="status-msg error">Couldn't load employers: ${escapeHtml(err.message)}</p>`;
      }
    }

    function wireSeekerButtons() {
      document.querySelectorAll('button[data-action="suspend-seeker"]').forEach((btn) => {
        btn.addEventListener("click", async () => {
          setButtonBusy(btn, true, "Working…");
          try {
            if (btn.dataset.status === "suspended") {
              await unsuspendSeekerAccount(btn.dataset.id);
            } else {
              await suspendSeekerAccount(btn.dataset.id);
            }
            await loadSeekers();
          } catch (err) {
            alert(`Couldn't update this account: ${err.message}`);
            setButtonBusy(btn, false);
          }
        });
      });
      document.querySelectorAll('button[data-action="delete-seeker"]').forEach((btn) => {
        btn.addEventListener("click", async () => {
          const confirmed = confirm(`Delete the account for "${btn.dataset.name}"? This can't be undone.`);
          if (!confirmed) return;
          setButtonBusy(btn, true, "Deleting…");
          try {
            await deleteSeekerAccount(btn.dataset.id);
            await loadSeekers();
          } catch (err) {
            alert(`Couldn't delete this account: ${err.message}`);
            setButtonBusy(btn, false);
          }
        });
      });
    }

    function wireEmployerButtons() {
      document.querySelectorAll('button[data-action="suspend-employer"]').forEach((btn) => {
        btn.addEventListener("click", async () => {
          setButtonBusy(btn, true, "Working…");
          try {
            if (btn.dataset.status === "suspended") {
              await unsuspendEmployerAccount(btn.dataset.id);
            } else {
              await suspendEmployerAccount(btn.dataset.id);
            }
            await loadEmployers();
          } catch (err) {
            alert(`Couldn't update this account: ${err.message}`);
            setButtonBusy(btn, false);
          }
        });
      });
      document.querySelectorAll('button[data-action="delete-employer"]').forEach((btn) => {
        btn.addEventListener("click", async () => {
          const confirmed = confirm(`Delete the account for "${btn.dataset.name}"? This can't be undone.`);
          if (!confirmed) return;
          setButtonBusy(btn, true, "Deleting…");
          try {
            await deleteEmployerAccount(btn.dataset.id);
            await loadEmployers();
          } catch (err) {
            alert(`Couldn't delete this account: ${err.message}`);
            setButtonBusy(btn, false);
          }
        });
      });
    }

    init();
  </script>
</body>
</html>
