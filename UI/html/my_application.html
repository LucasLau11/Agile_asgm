<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Applications</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/application.css" />
</head>
<body>

 <header class="topbar">
  <div class="brand">Job Portal</div>
  <div class="topbar-right">
    <nav>
      <a href="/UI/html/browse_job.html">Browse Jobs</a>
      <a href="/UI/html/my_application.html">My Applications</a>
      <a href="/UI/html/messages.html?role=seeker">Messages</a>
      <a href="/UI/html/notifications.html">Notifications</a>
      <a href="/UI/html/profile.html">Profile</a>
    </nav>
  </div>
</header>

  <div class="dev-user-bar" id="devUserBar"></div>

  <main class="page">
    <h1>My Applications</h1>
    <p class="subtitle">Track the progress of your submitted job applications.</p>

    <div class="application-list" id="applicationList">
      <p class="loading-state">Loading your applications...</p>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script>
    // Helper to safely prevent HTML injection layout breakage
    function escapeHtml(str) {
      if (!str) return "";
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Generate HTML for an individual application card dynamically
    function applicationCardHtml(app) {
      // Determine background color modifier depending on application workflow status
      let statusClass = "status-applied";
      const status = app.status || "Applied";
      
      if (status === "Screening") statusClass = "status-screening";
      else if (status === "Interview") statusClass = "status-interview";
      else if (status === "Offered") statusClass = "status-offered";
      else if (status === "Rejected") statusClass = "status-rejected";

      // Handle raw skill csv strings or array types safely
      let skillsHtml = "";
      if (app.skills) {
        const skillsArray = Array.isArray(app.skills) ? app.skills : app.skills.split(",");
        skillsHtml = skillsArray
          .map(skill => `<span class="skill-tag">${escapeHtml(skill.trim())}</span>`)
          .join("");
      }

      return `
        <div class="card application-card">
          <div class="application-main">
            <h3>${escapeHtml(app.job_title || "Job Title Not Specified")}</h3>
            <div class="application-meta">${escapeHtml(app.company || "Company Profile")}</div>
            <div class="application-meta">Applied on: ${escapeHtml(app.applied_date)}</div>
            <div style="margin-top: 8px;">
              ${skillsHtml}
            </div>
          </div>
          <div>
            <span class="application-status ${statusClass}">
              ${escapeHtml(status)}
            </span>
          </div>
        </div>
      `;
    }

    // Fetch records via async API routing and update view content area
    async function loadApplications() {
      const listEl = document.getElementById("applicationList");
      try {
        const applications = await fetchUserApplications();

        if (applications.length === 0) {
          listEl.innerHTML = `<div class="empty-state">You haven't submitted any job applications yet.</div>`;
          return;
        }

        // Render cards into the application-list element container
        listEl.innerHTML = applications.map(app => applicationCardHtml(app)).join("");

      } catch (err) {
        console.error(err);
        listEl.innerHTML = `
          <p class="status-msg error">
            Couldn't load applications: ${escapeHtml(err.message)}. Is the FastAPI server running?
          </p>
        `;
      }
    }

    async function init() {
      const account = await requireLogin("seeker");
      if (!account) return;
      renderAccountBar("devUserBar", account);
      await loadApplications();
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
  <footer class="site-footer">
  <div class="footer-content">
    <p>&copy; 2026 Job Portal. All rights reserved.</p>
    <nav class="footer-links">
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/contact">Contact</a>
    </nav>
  </div>
</footer>
</body>
</html>
