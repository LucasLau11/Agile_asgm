<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/application.css" />
</head>
<body>

  <header class="topbar">
  <div class="brand">Job Portal</div>
  <div class="topbar-right">
    <nav>
      <a href="/UI/html/browse_job.html">Browse Jobs</a>
      <a href="/UI/html/my_application.html">My Applications</a>
      <a href="/UI/html/messages.html?role=seeker">Messages</a>
      <a href="/UI/html/notifications.html">Notifications</a>
      <a href="/UI/html/profile.html">Profile</a>
    </nav>
  </div>
</header>

  <div class="dev-user-bar" id="devUserBar"></div>

  <main class="page">
    <h1>Notifications</h1>
    <p class="subtitle">Stay updated with your application progress.</p>

    <button class="btn btn-secondary" id="clearAllBtn" style="margin-bottom:14px;">Clear all</button>

    <div class="notification-list" id="notificationList">
      <p class="loading-state">Loading notifications...</p>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script>
    function escapeHtml(str) {
      if (!str) return "";
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function notificationCardHtml(note) {
      return `
        <div class="card notification-card" data-id="${note.id}">
          <div class="notification-icon">🔔</div>
          <div class="notification-content">
            <h3>${escapeHtml(note.title)}</h3>
            <p>${escapeHtml(note.message)}</p>
            <div class="notification-time">${escapeHtml(note.time_ago)}</div>
          </div>
          <button class="btn btn-secondary remove-notification-btn" data-id="${note.id}" title="Remove">✕</button>
        </div>
      `;
    }

    async function loadNotifications() {
      const listEl = document.getElementById("notificationList");
      try {
        const notifications = await fetchNotifications();

        if (notifications.length === 0) {
          listEl.innerHTML = `<div class="empty-state">You don't have any notifications yet.</div>`;
          return;
        }

        listEl.innerHTML = notifications.map(notificationCardHtml).join("");
        wireRemoveButtons();
      } catch (err) {
        console.error(err);
        listEl.innerHTML = `
          <p class="status-msg error">
            Couldn't load notifications: ${escapeHtml(err.message)}. Is the FastAPI server running?
          </p>
        `;
      }
    }



    function wireRemoveButtons() {
      document.querySelectorAll(".remove-notification-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const id = Number(btn.dataset.id);
          btn.disabled = true;
          try {
            await deleteNotification(id);
            await loadNotifications();
          } catch (err) {
            alert(`Couldn't remove notification: ${err.message}`);
            btn.disabled = false;
          }
        });
      });
    }

    document.getElementById("clearAllBtn").addEventListener("click", async () => {
      if (!confirm("Remove all notifications? This can't be undone.")) return;
      try {
        await clearAllNotifications();
        await loadNotifications();
      } catch (err) {
        alert(`Couldn't clear notifications: ${err.message}`);
      }
    });

    async function init() {
      const account = await requireLogin("seeker");
      if (!account) return;
      renderAccountBar("devUserBar", account);
      await loadNotifications();
    }

    init();
  </script>
</body>
</html>
