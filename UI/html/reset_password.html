<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Job Portal</div>
  </header>

  <main class="page" style="max-width: 420px;">
    <h1>Reset password</h1>
    <p class="subtitle">Enter your email to receive a reset link.</p>

    <section class="profile-section">
      <form id="resetRequestForm" novalidate>
        <div class="form-field" style="margin-bottom:12px;">
          <label for="resetEmailInput">Email</label>
          <input type="email" id="resetEmailInput" required />
          <div class="field-error" id="resetEmailError"></div>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Send reset link</button>
      </form>

      <form id="resetForm" novalidate style="display:none; margin-top:20px;">
        <div class="form-field" style="margin-bottom:12px;">
          <label for="tokenInput">Reset token</label>
          <input type="text" id="tokenInput" required />
          <div class="field-error" id="tokenError"></div>
        </div>
        <div class="form-field" style="margin-bottom:12px;">
          <label for="newPasswordInput">New password</label>
          <input type="password" id="newPasswordInput" required />
          <div class="field-error" id="newPasswordError"></div>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Set new password</button>
      </form>

      <p class="status-msg" id="resetStatus"></p>
      <p class="subtitle" style="margin-top:16px; margin-bottom:0;">
        <a href="login.html">Back to log in</a>
      </p>
    </section>
  </main>

  <script src="/UI/js/api.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");
    const role = params.get("role");

    const resetRequestForm = document.getElementById("resetRequestForm");
    const resetForm = document.getElementById("resetForm");
    const resetStatus = document.getElementById("resetStatus");

    if (token) {
      resetRequestForm.style.display = "none";
      resetForm.style.display = "block";
      document.getElementById("tokenInput").value = token;
      resetStatus.textContent = "Choose a new password for your account.";
      resetStatus.className = "status-msg success";
    }

    resetRequestForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("resetEmailInput").value.trim();
      document.getElementById("resetEmailError").textContent = "";
      resetStatus.textContent = "";
      if (!email) {
        document.getElementById("resetEmailError").textContent = "Email is required.";
        return;
      }

      const submitBtn = e.target.querySelector('button[type="submit"]');
      setButtonBusy(submitBtn, true, "Sending…");
      try {
        const response = await requestPasswordReset(email);
        resetStatus.textContent = response.message || "If an account exists with that email, a reset link has been sent.";
        resetStatus.className = "status-msg success";
      } catch (err) {
        resetStatus.textContent = err.message;
        resetStatus.className = "status-msg error";
      } finally {
        setButtonBusy(submitBtn, false);
      }
    });

    resetForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const tokenValue = document.getElementById("tokenInput").value.trim();
      const newPassword = document.getElementById("newPasswordInput").value;
      document.getElementById("tokenError").textContent = "";
      document.getElementById("newPasswordError").textContent = "";
      resetStatus.textContent = "";

      if (!tokenValue) {
        document.getElementById("tokenError").textContent = "Token is required.";
        return;
      }
      if (!newPassword || newPassword.length < 8) {
        document.getElementById("newPasswordError").textContent = "Password must be at least 8 characters.";
        return;
      }

      const submitBtn = e.target.querySelector('button[type="submit"]');
      setButtonBusy(submitBtn, true, "Updating…");
      try {
        const response = await resetPassword(tokenValue, newPassword);
        resetStatus.textContent = response.message || "Password reset successfully.";
        resetStatus.className = "status-msg success";
        resetForm.reset();
        setTimeout(() => { window.location.href = "login.html"; }, 1200);
      } catch (err) {
        resetStatus.textContent = err.message;
        resetStatus.className = "status-msg error";
      } finally {
        setButtonBusy(submitBtn, false);
      }
    });
  </script>
</body>
</html>
